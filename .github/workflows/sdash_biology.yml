name: Stalwart Prep - SdashAPI Biology Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-biology:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Biology extraction
        env:
          SDASH_API_TOKEN: ${{ secrets.SDASH_API_TOKEN }}
        run: |
          python scripts/extract_sdash.py

      - name: Upload extracted questions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stalwart-Prep-Sdash-Biology-2015-2026
          path: |
            data/sdash/
          if-no-files-found: warn
          retention-days: 30
